<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Keine Verbindung – Quadratmeter</title>
<style>
  :root { --bg: #edf0ef; --sheet: #fff; --ink: #17222b; --ink-2: #4c5963; --accent: #1f4fa3; --rule: #cdd5da; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11171d; --sheet: #182129; --ink: #e5ebef; --ink-2: #aab6bf; --accent: #84a9ee; --rule: #2c3842; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1rem; box-sizing: border-box; }
  main { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 2rem; max-width: 420px; }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  p { color: var(--ink-2); margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 0.6rem 1.1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Keine Verbindung</h1>
  <p>Quadratmeter braucht eine Internetverbindung, damit deine Wohnungen immer aktuell sind. Prüfe WLAN oder mobile Daten und versuch es noch einmal.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
